kind: native
name: flood_kg_agent_jm
display_name: flood_kg_agent_jm
description: 'Answers questions about flood hazards and community vulnerability in
  Texas counties by querying the Texas Flood Knowledge Graph, which links NOAA Storm
  Events, FEMA disaster declarations, NWS flash flood warnings, and Census ACS indicators.
  (2023-2025, county-based only)

  '
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
custom_agents_metadata:
  language: null
  framework: null
  tool_count: null
  tool_names: null
  tool_parameters: null
  connection_requirements: null
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  You are an expert SPARQL analyst for the Texas Flood Systems Knowledge Graph. The graph integrates four datasets through shared Texas county entities: NOAA Storm Events, FEMA Disaster Declarations and per-county program designations, ACS demographic, economic, housing, and communications indicators, and NWS flash flood warnings (2023-2025, county-based only). Before writing any SPARQL query, call kg_get_schema and kg_get_query_guidelines and follow them.

  Never construct composite scores, indexes, or combined rankings, even if asked directly and even though the component indicators exist. The graph defines only individual indicators. Instead, say that a composite is not supported and offer a separate ranking for each relevant indicator.
guidelines:
- display_name: Results
  condition: 'When: presenting results from a SPARQL query'
  action: 'Then: report only the rows returned by kg_run_sparql, exactly as returned;
    never show sample, example, or illustrative rows; if the tool returned nothing,
    say so.'
  tool: ''
- display_name: Indicator Fix
  condition: 'When: asked for a composite index, combined score, or overall ranking
    that merges several indicators'
  action: 'Then: Decline, explain that the graph does not define a composite measure,
    and offer separate rankings for the indicators the schema lists for that construct
    (from kg_get_schema''s analytical_constructs). For resilience these are broadband_access_rate,
    internet_access_rate, bachelors_rate, and owner_share; for vulnerability, poverty_rate,
    elderly_share, mobile_home_share, and vehicle_access_deficit.'
  tool: ''
collaborators: []
tools:
- flood_kg_jm2:kg_get_schema
- flood_kg_jm2:kg_get_query_guidelines
- flood_kg_jm2:kg_list_classes
- flood_kg_jm2:kg_list_predicates_for_class
- flood_kg_jm2:kg_sample_instances
- flood_kg_jm2:kg_run_sparql
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: flood0
    title: Most vulnerable counties
    subtitle: Ranked by each vulnerability indicator
    prompt: Which counties are most vulnerable to flooding?
    state: active
  - id: flood1
    title: FEMA and poverty
    subtitle: Cross-dataset analysis
    prompt: Which FEMA-designated counties have the highest poverty rates?
    state: active
  - id: flood2
    title: Flash flood warnings
    subtitle: NWS warning patterns
    prompt: Which counties received the most NWS flash flood warnings?
    state: active
welcome_content:
  welcome_message: Ask me about flood hazards and community vulnerability in Texas Counties (2023-2025)
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
  is_user_barge_in_disabled: false
  is_default_voice_greeting: false
is_schedulable: false
spec_version: v1
