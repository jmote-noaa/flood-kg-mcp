[project]
name = "flood-kg-mcp"
version = "0.1.0"
description = "Flood Knowledge Graph MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyoxigraph>=0.5.11",
]

[project.scripts]
# Lets you run the server with `uv run flood-kg-mcp`.
flood-kg-mcp = "flood_kg_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flood_kg_mcp"]

[dependency-groups]
# Dev + eval-only deps. Install with `uv sync --group dev`.
# The Phoenix evaluation harness (see eval/) is not scaffolded in this template
# on purpose — add these when you build it per the mcp-eval skill.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
